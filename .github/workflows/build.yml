name: Build MidnaFX

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-2025-vs2026
            preset: windows-release
          - platform: macos-x86_64
            runner: macos-15-intel
            preset: macos-intel-release
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out MidnaFX
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out researched Dusklight SDK revision
        uses: actions/checkout@v4
        with:
          repository: TwilitRealm/dusklight
          ref: edf42c6a7202647b56dd2fcdef02d17671bc814b
          path: upstream/dusklight
          submodules: false

      - name: Initialize pinned Aurora submodule
        shell: bash
        run: git -C upstream/dusklight submodule update --init --depth 1 extern/aurora

      - name: Check candidate CPU-skinning host patch
        shell: bash
        run: python tools/host-patch.py --dusklight-dir upstream/dusklight

      - name: Apply camera FOV host patch
        shell: bash
        run: python tools/camera-host-patch.py --dusklight-dir upstream/dusklight --apply

      - name: Configure
        shell: bash
        run: cmake --preset "${{ matrix.preset }}"

      - name: Repair upstream macOS SDK link stub UUID
        if: matrix.platform == 'macos-x86_64'
        shell: bash
        run: python3 tools/add_macho_uuid.py build/macos-intel-release/dusklight-sdk-stubs/stub-macos-x86_64

      - name: Build native package
        shell: bash
        run: cmake --build --preset "${{ matrix.preset }}" --parallel

      - name: Run package and parameter tests
        shell: bash
        run: ctest --preset "${{ matrix.preset }}"

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: midnafx-${{ matrix.platform }}
          path: build/${{ matrix.preset }}/mods/midnafx.dusk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Name release assets
        shell: bash
        run: |
          cp dist/midnafx-windows-amd64/midnafx.dusk dist/midnafx-windows-amd64.dusk
          cp dist/midnafx-macos-x86_64/midnafx.dusk dist/midnafx-macos-x86_64.dusk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
          gh release create "$GITHUB_REF_NAME" \
            dist/midnafx-windows-amd64.dusk \
            dist/midnafx-macos-x86_64.dusk \
            --verify-tag \
            --title "MidnaFX ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
